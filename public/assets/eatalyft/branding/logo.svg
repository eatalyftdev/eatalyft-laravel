<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" aria-label="EataLyft">
  <!-- EataLyft logomark: stylized bus + route line -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bus body -->
    <path d="M28 30 h64 v12 H28 z" stroke="#DC2626" stroke-width="6" stroke-linejoin="round"/>
    <!-- Bus roof curve -->
    <path d="M28 30 Q92 18 156 30" stroke="url(#brandGradient)" stroke-width="5"/>
    <!-- Wheels -->
    <circle cx="44" cy="44" r="5" fill="#DC2626"/>
    <circle cx="44" cy="44" r="2" fill="#FFFFFF"/>
    <circle cx="92" cy="44" r="5" fill="#DC2626"/>
    <circle cx="92" cy="44" r="2" fill="#FFFFFF"/>
    <!-- Windows -->
    <rect x="40" y="32" width="14" height="8" fill="#FFFFFF" opacity="0.9" rx="2"/>
    <rect x="58" y="32" width="14" height="8" fill="#FFFFFF" opacity="0.9" rx="2"/>
    <rect x="76" y="32" width="14" height="8" fill="#FFFFFF" opacity="0.9" rx="2"/>
    <!-- Route line under bus -->
    <path d="M24 46 L176 46" stroke="#EF4444" stroke-width="3" opacity="0.4"/>
    <path d="M24 46 L60 46" stroke="#DC2626" stroke-width="3"/>
    <!-- Location dots on route -->
    <circle cx="100" cy="46" r="2.5" fill="#DC2626"/>
    <circle cx="140" cy="46" r="2.5" fill="#DC2626"/>
    <circle cx="176" cy="46" r="2.5" fill="#DC2626"/>
  </g>
  <text x="190" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#DC2626" letter-spacing="-0.02em">EATA<span fill="#FFFFFF" style="background:#DC2626;padding:0 4px;border-radius:4px;">LYFT</span></text>
</svg>
