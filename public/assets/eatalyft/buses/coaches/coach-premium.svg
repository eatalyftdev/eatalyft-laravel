<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" aria-label="Premium intercity coach exterior placeholder">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>
  <!-- Sun -->
  <circle cx="700" cy="60" r="24" fill="#FCD34D" opacity="0.9"/>
  <!-- Road -->
  <rect y="320" width="800" height="130" fill="url(#roadGrad)"/>
  <!-- Road edge -->
  <line x1="0" y1="320" x2="800" y2="320" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Grass -->
  <rect y="320" width="800" height="130" fill="#166534" opacity="0.15"/>
  <!-- Coach body -->
  <g filter="url(#shadow)">
    <rect x="120" y="160" width="560" height="120" fill="url(#busGrad)" stroke="#9CA3AF" stroke-width="2" rx="12"/>
    <!-- Roof -->
    <path d="M120 160 Q400 130 680 160" stroke="#DC2626" stroke-width="6" fill="none"/>
    <!-- Windows -->
    <rect x="140" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <rect x="190" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <rect x="240" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <rect x="290" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <rect x="340" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <rect x="390" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <rect x="440" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <rect x="490" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <rect x="540" y="172" width="44" height="48" fill="#E5E7EB" rx="4"/>
    <!-- Door -->
    <rect x="610" y="172" width="44" height="60" fill="#E5E7EB" stroke="#DC2626" stroke-width="2" rx="4"/>
    <!-- Wheels -->
    <circle cx="200" cy="280" r="20" fill="#1F2933"/>
    <circle cx="200" cy="280" r="10" fill="#DC2626"/>
    <circle cx="580" cy="280" r="20" fill="#1F2933"/>
    <circle cx="580" cy="280" r="10" fill="#DC2626"/>
    <!-- Headlight -->
    <circle cx="124" y="210" r="6" fill="#FCD34D"/>
  </g>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
