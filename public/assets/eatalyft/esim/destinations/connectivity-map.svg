<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" aria-label="Connectivity map placeholder">
  <defs>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#mapGrad)"/>
  <!-- Continent shapes -->
  <path d="M200 150 Q300 100 400 150 Q450 200 400 250 Q350 300 250 250 Q200 200 200 150 Z" fill="#D1D5DB"/>
  <!-- Connection dots -->
  <circle cx="220" cy="180" r="5" fill="#DC2626"/>
  <circle cx="300" cy="140" r="5" fill="#DC2626"/>
  <circle cx="380" cy="200" r="5" fill="#DC2626"/>
  <circle cx="320" cy="260" r="5" fill="#DC2626"/>
  <circle cx="260" cy="220" r="5" fill="#DC2626"/>
  <!-- Connection lines -->
  <path d="M220 180 L300 140" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
  <path d="M300 140 L380 200" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
  <path d="M380 200 L320 260" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
  <path d="M320 260 L260 220" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
  <path d="M260 220 L220 180" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
  <!-- Coverage rings -->
  <circle cx="300" cy="200" r="80" fill="none" stroke="#DC2626" stroke-width="2" opacity="0.3"/>
  <circle cx="300" cy="200" r="120" fill="none" stroke="#DC2626" stroke-width="2" opacity="0.15"/>
  <!-- Label -->
  <text x="400" y="400" font-family="system-ui" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle">Regional Coverage</text>
  <text x="400" y="418" font-family="system-ui" font-size="12" fill="#52525B" text-anchor="middle">Connected destinations</text>
</svg>
