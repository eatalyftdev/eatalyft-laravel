<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" aria-label="Cameroon highlands destination placeholder">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="180" fill="url(#skyGrad)"/>
  <circle cx="720" cy="60" r="24" fill="#FCD34D" opacity="0.9"/>
  <!-- Mountains -->
  <path d="M0 180 L120 90 L240 180 L360 110 L480 180 L600 130 L720 180 L800 150 L800 180 Z" fill="url(#mountainGrad)"/>
  <path d="M200 180 L300 110 L400 180 L500 120 L600 180 L700 140 L800 180 Z" fill="#E5E7EB" opacity="0.7"/>
  <!-- Foreground hills -->
  <path d="M0 260 Q200 220 400 260 Q600 220 800 260 L800 450 L0 450 Z" fill="#166534" opacity="0.8"/>
  <!-- Trees -->
  <g fill="#14532D">
    <circle cx="100" cy="270" r="18"/>
    <circle cx="180" cy="265" r="20"/>
    <circle cx="260" cy="272" r="16"/>
    <circle cx="540" cy="268" r="19"/>
    <circle cx="620" cy="274" r="17"/>
    <circle cx="700" cy="266" r="15"/>
  </g>
  <!-- Label -->
  <text x="400" y="420" font-family="system-ui" font-size="16" font-weight="800" fill="#1F2933" text-anchor="middle">Cameroon Highlands</text>
  <text x="400" y="438" font-family="system-ui" font-size="12" fill="#52525B" text-anchor="middle">West Africa</text>
</svg>
