<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" aria-label="Game category placeholder">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Card -->
    <rect x="20" y="20" width="260" height="160" fill="url(#cardGrad)" stroke="#E4E4E7" stroke-width="2" rx="16"/>
    <!-- Category artwork -->
    <rect x="40" y="40" width="220" height="90" fill="#D1D5DB" rx="12"/>
    <circle cx="140" cy="85" r="24" fill="#DC2626" opacity="0.25"/>
    <circle cx="220" cy="85" r="18" fill="#EF4444" opacity="0.15"/>
    <!-- Controller icon -->
    <circle cx="150" cy="95" r="20" fill="#DC2626"/>
    <path d="M138 88 L162 95 L138 102" fill="#FFFFFF"/>
    <!-- Label -->
    <text x="40" y="160" font-family="system-ui" font-size="14" font-weight="700" fill="#1F2933">Category</text>
    <text x="40" y="178" font-family="system-ui" font-size="12" fill="#52525B">Games</text>
  </g>
</svg>
