<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" aria-label="Route path illustration">
  <defs>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Decorative background -->
    <circle cx="540" cy="160" r="100" fill="#EF4444" opacity="0.08"/>
    <circle cx="60" cy="40" r="90" fill="#DC2626" opacity="0.06"/>
    
    <!-- Main route path -->
    <path d="M60 110 Q180 50 300 110 Q420 170 540 110" stroke="url(#routeGrad)" stroke-width="5" fill="none"/>
    <path d="M60 110 Q180 50 300 110 Q420 170 540 110" stroke="#FFFFFF" stroke-width="2" opacity="0.5" fill="none" stroke-dasharray="10 10"/>
    
    <!-- Origin marker -->
    <g transform="translate(60 110)">
      <circle r="9" fill="#DC2626"/>
      <circle r="14" fill="none" stroke="#DC2626" stroke-width="2.5"/>
      <path d="M-5 -22 L0 -30 L5 -22" stroke="#DC2626" stroke-width="3"/>
      <text x="0" y="-40" font-family="system-ui" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">Origin</text>
    </g>
    
    <!-- Intermediate stop -->
    <g transform="translate(300 110)">
      <circle r="6" fill="#EF4444"/>
      <circle r="11" fill="none" stroke="#EF4444" stroke-width="2"/>
      <path d="M-4 -16 L0 -22 L4 -16" stroke="#EF4444" stroke-width="2.5"/>
      <text x="0" y="-32" font-family="system-ui" font-size="10" fill="#52525B" text-anchor="middle">Stop</text>
    </g>
    
    <!-- Destination marker -->
    <g transform="translate(540 110)">
      <circle r="9" fill="#166534"/>
      <circle r="14" fill="none" stroke="#166534" stroke-width="2.5"/>
      <path d="M-5 -22 L0 -30 L5 -22" stroke="#166534" stroke-width="3"/>
      <text x="0" y="-40" font-family="system-ui" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Destination</text>
    </g>
    
    <!-- Small decorative dots along path -->
    <circle cx="140" cy="85" r="3" fill="#DC2626" opacity="0.5"/>
    <circle cx="420" cy="140" r="3" fill="#DC2626" opacity="0.5"/>
    <circle cx="220" cy="90" r="3" fill="#DC2626" opacity="0.5"/>
  </g>
</svg>
