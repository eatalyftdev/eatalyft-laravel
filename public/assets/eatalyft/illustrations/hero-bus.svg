<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" aria-label="Hero bus illustration">
  <defs>
    <linearGradient id="heroBusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>
    <linearGradient id="heroRouteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="16" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Background decorative shapes -->
    <circle cx="720" cy="80" r="140" fill="#EF4444" opacity="0.10"/>
    <circle cx="80" cy="320" r="160" fill="#DC2626" opacity="0.08"/>
    <path d="M400 50 Q600 350 200 380" stroke="#DC2626" stroke-width="2" opacity="0.08"/>
    
    <!-- Route path line -->
    <path d="M60 320 Q300 60 740 340" stroke="url(#heroRouteGrad)" stroke-width="4" fill="none"/>
    <path d="M60 320 Q300 60 740 340" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" fill="none" stroke-dasharray="8 8"/>
    
    <!-- Location markers along route -->
    <circle cx="200" cy="200" r="6" fill="#DC2626"/>
    <circle cx="200" cy="200" r="10" fill="none" stroke="#DC2626" stroke-width="2"/>
    <circle cx="520" cy="160" r="6" fill="#DC2626"/>
    <circle cx="520" cy="160" r="10" fill="none" stroke="#DC2626" stroke-width="2"/>
    
    <!-- Bus -->
    <g filter="url(#heroShadow)">
      <!-- Bus body -->
      <path d="M260 180 h240 v-60 H260 z" fill="url(#heroBusGrad)" stroke="#E4E4E7" stroke-width="2" rx="12"/>
      <!-- Bus roof -->
      <path d="M260 180 Q380 140 500 180" stroke="#DC2626" stroke-width="6" fill="none"/>
      <!-- Windows -->
      <rect x="275" y="192" width="34" height="28" fill="#FFFFFF" opacity="0.85" rx="4"/>
      <rect x="315" y="192" width="34" height="28" fill="#FFFFFF" opacity="0.85" rx="4"/>
      <rect x="355" y="192" width="34" height="28" fill="#FFFFFF" opacity="0.85" rx="4"/>
      <rect x="395" y="192" width="34" height="28" fill="#FFFFFF" opacity="0.85" rx="4"/>
      <!-- Door -->
      <rect x="445" y="192" width="26" height="36" fill="#E4E4E7" stroke="#DC2626" stroke-width="2" rx="4"/>
      <!-- Wheels -->
      <circle cx="300" cy="228" r="16" fill="#1F2933"/>
      <circle cx="300" cy="228" r="8" fill="#DC2626"/>
      <circle cx="460" cy="228" r="16" fill="#1F2933"/>
      <circle cx="460" cy="228" r="8" fill="#DC2626"/>
      <!-- Headlight -->
      <circle cx="264" cy="190" r="5" fill="#FCD34D"/>
      <!-- Motion lines behind bus -->
      <path d="M220 200 L250 200" stroke="#DC2626" stroke-width="3" opacity="0.5"/>
      <path d="M220 220 L250 220" stroke="#DC2626" stroke-width="3" opacity="0.3"/>
    </g>
    
    <!-- Ticket preview floating -->
    <g transform="translate(560 220)">
      <rect x="0" y="0" width="150" height="110" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="2" rx="16" filter="url(#heroShadow)"/>
      <rect x="0" y="0" width="150" height="48" fill="#DC2626" rx="16 16 0 0"/>
      <text x="20" y="32" font-family="system-ui" font-size="14" font-weight="700" fill="#FFFFFF">E-TICKET</text>
      <text x="20" y="50" font-family="system-ui" font-size="12" fill="#FFFFFF" opacity="0.9">CONFIRMED</text>
      <rect x="20" y="64" width="110" height="8" fill="#F4F4F5" rx="4"/>
      <rect x="20" y="78" width="70" height="8" fill="#F4F4F5" rx="4"/>
      <rect x="20" y="92" width="50" height="8" fill="#F4F4F5" rx="4"/>
      <!-- QR code -->
      <g transform="translate(100 64)">
        <rect x="0" y="0" width="36" height="36" fill="#DC2626" rx="4"/>
        <rect x="6" y="6" width="8" height="8" fill="#FFFFFF"/>
        <rect x="22" y="6" width="8" height="8" fill="#FFFFFF"/>
        <rect x="6" y="22" width="8" height="8" fill="#FFFFFF"/>
        <rect x="22" y="22" width="8" height="8" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
